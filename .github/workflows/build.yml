name: build

on:
  workflow_dispatch:
  push:
    tags: ["llvm-*"]
  pull_request:
    paths: ["llvm.env", "scripts/**", ".github/workflows/build.yml"]

jobs:
  macos-arm64:
    runs-on: macos-15  # the runner culebra's release.yml builds on
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          brew install ninja zstd || true
          cmake --version
          ninja --version
          xcodebuild -version
      - name: Build
        run: |
          start=$(date +%s)
          scripts/build-macos.sh
          echo "total seconds: $(( $(date +%s) - start ))"
      - name: Verify
        run: scripts/verify-macos.sh out/prefix
      - name: Summary
        run: |
          {
            echo "### macos-arm64"
            echo '```'
            cat out/prefix/BUILD_INFO.txt
            du -sh out/prefix out/*.tar.zst
            cat out/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-macos-arm64
          path: |
            out/*.tar.zst
            out/*.sha256
          retention-days: 7
      - name: Release
        if: startsWith(github.ref, 'refs/tags/llvm-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./llvm.env
          {
            echo "Static LLVM $LLVM_VERSION libraries for building culebra, macOS arm64."
            echo
            echo "Built by this repository's CI from the tag's commit ($GITHUB_SHA)."
            echo
            echo '```'
            cat out/prefix/BUILD_INFO.txt
            cat out/*.sha256
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/*.tar.zst out/*.sha256 \
            --title "LLVM $LLVM_VERSION macOS arm64 ($GITHUB_REF_NAME)" \
            --notes-file notes.md
